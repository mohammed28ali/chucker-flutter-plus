name: chucker_flutter_plus
description: In-app HTTP inspector for Flutter with request history, notifications, and shared logging for Dio, Chopper, and package:http.
version: 0.1.0
homepage: https://github.com/mohammed28ali/chucker-flutter-plus
repository: https://github.com/mohammed28ali/chucker-flutter-plus
issue_tracker: https://github.com/mohammed28ali/chucker-flutter-plus/issues
topics:
  - flutter
  - http
  - network
  - inspector
  - logging

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.11.1
  chopper: ^8.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.3.0
  http: ^1.6.0
  share_plus: ^13.3.1
  fluttertoast: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic

    - family: monospace
      fonts:
        - asset: assets/fonts/monospace/Monospace.ttf
        - asset: assets/fonts/monospace/MonospaceBold.ttf
          weight: 700
        - asset: assets/fonts/monospace/MonospaceOblique.ttf
          style: italic
